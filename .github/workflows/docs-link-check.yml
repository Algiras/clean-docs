name: Docs Link Check

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '*.md'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install clean-docs
      run: |
        pip install -e .
    
    - name: Check documentation links
      run: |
        clean-docs doctor
        clean-docs scan . --internal-only --format json > link-check-results.json || true
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: link-check-results
        path: link-check-results.json
        if-no-files-found: ignore
    
    - name: Check for broken links
      run: |
        if [ -f link-check-results.json ]; then
          BROKEN=$(python -c "import json; print(json.load(open('link-check-results.json'))['summary']['broken_links'])")
          if [ "$BROKEN" -gt 0 ]; then
            echo "Found $BROKEN broken links"
            cat link-check-results.json | python -m json.tool
            exit 1
          fi
        fi
