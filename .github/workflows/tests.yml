name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Run type checking
      run: |
        mypy clean_docs/ --ignore-missing-imports
      continue-on-error: true

    - name: Run linting
      run: |
        ruff check clean_docs/

    - name: Check formatting
      run: |
        black --check clean_docs/

  test-snippets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install with snippets dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,snippets]"

    - name: Test snippet validation imports
      run: |
        python -c "from clean_docs.symbol_indexer import SymbolIndexer; print('Snippets deps OK')"

    - name: Run snippet validation tests
      run: |
        pytest tests/test_snippet_validator.py -v

  test-semantic:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install with semantic dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,semantic]"

    - name: Test semantic imports
      run: |
        python -c "from clean_docs.semantic import EmbeddingManager; print('Semantic deps OK')"

    - name: Run full test suite
      run: |
        pytest tests/ -v

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
        pip install pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=clean_docs --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Install package
      run: |
        pip install dist/*.whl
        clean-docs --version
