site_name: Clean Docs
site_url: https://algiras.github.io/clean-docs
site_description: CLI tool for documentation quality - validate code snippets, detect broken links, auto-fix issues
site_author: Algimantas Krasauskas
repo_url: https://github.com/Algiras/clean-docs
repo_name: Algiras/clean-docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Features:
      - Code Snippet Validation: features/snippet-validation.md
      - Link Checking: features/link-checking.md
      - Auto-Fix: features/auto-fix.md
  - Guides:
      - CI/CD Integration: guides/ci-cd.md
  - GitHub: https://github.com/Algiras/clean-docs

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Algiras/clean-docs
  generator: false
