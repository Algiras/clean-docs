[project]
name = "clean-docs"
version = "0.1.0"
description = "CLI tool for documentation quality - validate code snippets, detect broken links, auto-fix issues"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Algimantas Krasauskas", email = "algimantas.krasauskas@gmail.com"},
]
keywords = [
    "documentation",
    "docs",
    "linting",
    "markdown",
    "code-snippets",
    "link-checker",
    "tree-sitter",
    "cli",
    "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: Markdown",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/Algiras/clean-docs"
Documentation = "https://algiras.github.io/clean-docs"
Repository = "https://github.com/Algiras/clean-docs.git"
Issues = "https://github.com/Algiras/clean-docs/issues"
Changelog = "https://github.com/Algiras/clean-docs/releases"

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.3.0",
    "torch>=2.0.0",
]
snippets = [
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.2.0",
]
vectors = [
    "sqlite-vec>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
clean-docs = "clean_docs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clean_docs"]

[tool.hatch.build.targets.sdist]
include = [
    "clean_docs/**/*.py",
    "clean_docs/py.typed",
    "tests/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
